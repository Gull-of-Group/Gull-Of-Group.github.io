<!-- TRUSTED BRANDS BANNER — animated marquee -->
<div class="mt-20 pt-10 border-t border-bw-border">
  <p class="text-xs font-semibold uppercase tracking-widest text-bw-muted mb-8">Trusted by growing brands worldwide</p>
  <div class="marquee-viewport overflow-hidden">
    <div class="marquee-track opacity-80 hover:opacity-100 transition-all flex items-center gap-12">
      
      <!-- Text Logos -->
      <span class="font-display text-xl font-bold tracking-widest text-white">STUDIO</span>
      <span class="font-display text-xl font-black tracking-wider text-white">NOVA</span>
      <span class="font-display text-xl font-bold tracking-widest text-white">LUMINA</span>
      <span class="font-display text-xl font-black tracking-tight text-white">PULSE</span>
      <span class="font-display text-xl font-bold tracking-widest text-white">VERTICE</span>
      <span class="font-display text-xl font-bold tracking-widest text-white">ORBIT</span>
      <span class="font-display text-xl font-black tracking-wider text-white">HALCYON</span>
      <span class="font-display text-xl font-bold tracking-tight text-white">FORGE&nbsp;CO.</span>

      <!-- Right Side Glowing & Blinking Custom Logo -->
      <img src="YOUR_LOGO_URL_HERE.png" alt="Logo" class="h-10 sm:h-12 w-auto object-contain animate-pulse filter drop-shadow-[0_0_12px_rgba(91,226,34,0.8)] mx-4" />

      <!-- Duplicate Set for Seamless Loop -->
      <span class="font-display text-xl font-bold tracking-widest text-white" aria-hidden="true">STUDIO</span>
      <span class="font-display text-xl font-black tracking-wider text-white" aria-hidden="true">NOVA</span>
      <span class="font-display text-xl font-bold tracking-widest text-white" aria-hidden="true">LUMINA</span>
      <span class="font-display text-xl font-black tracking-tight text-white" aria-hidden="true">PULSE</span>
      <span class="font-display text-xl font-bold tracking-widest text-white" aria-hidden="true">VERTICE</span>
      <span class="font-display text-xl font-bold tracking-widest text-white" aria-hidden="true">ORBIT</span>
      <span class="font-display text-xl font-black tracking-wider text-white" aria-hidden="true">HALCYON</span>
      <span class="font-display text-xl font-bold tracking-tight text-white" aria-hidden="true">FORGE&nbsp;CO.</span>

      <!-- Duplicate Right Side Glowing & Blinking Custom Logo -->
      <img src="YOUR_LOGO_URL_HERE.png" alt="Logo" class="h-10 sm:h-12 w-auto object-contain animate-pulse filter drop-shadow-[0_0_12px_rgba(91,226,34,0.8)] mx-4" aria-hidden="true" />

    </div>
  </div>
</div>
